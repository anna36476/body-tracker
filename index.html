<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body & Nutrition Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f5f5f7;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    let firebaseUser = null;
    let firebaseIdToken = null;
    let projectId = null;
    let geminiApiKey = null;

    const firebaseAPI = {
      async signIn(apiKey) {
        const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ returnSecureToken: true }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Sign in failed');
        firebaseUser = { uid: data.localId };
        firebaseIdToken = data.idToken;
        return firebaseUser;
      },

      async set(path, value) {
        const url = `https://${projectId}-default-rtdb.firebaseio.com/${path}.json?auth=${firebaseIdToken}`;
        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(value),
        });
        if (!res.ok) throw new Error('Save failed');
        return res.json();
      },

      async get(path) {
        const url = `https://${projectId}-default-rtdb.firebaseio.com/${path}.json?auth=${firebaseIdToken}`;
        const res = await fetch(url);
        if (res.status === 404) return null;
        if (!res.ok) throw new Error('Load failed');
        return res.json();
      },
    };

    const PROMPTS = {
      cleanMealName: (food) => `Clean up this meal description into a short, normal meal name. Remove typos, extra words, and convert to proper format.

Input: "${food}"

Reply with ONLY the cleaned meal name (2-4 words max), nothing else.`,

      textMeal: (food) => `You are a professional nutritionist. Estimate the nutritional content of this meal using standard USDA nutritional data as reference.

MEAL: "${food}"

Requirements:
- Use realistic, accurate estimates based on typical serving sizes
- Assume standard restaurant/home portions if not specified
- Consider typical cooking methods and ingredients
- Be conservative: round up calories when uncertain
- Base calculations on USDA or similar nutrition databases

REPLY ONLY with this exact format (no additional text):
calories:XXX | protein:XXg | carbs:XXg | fat:XXg
good:<one specific positive nutritional aspect>
bad:<one specific area for improvement>`,

      perfectNextMeal: (previousMeals, todayMeals, totalCals, totalProt, totalCarb, totalFat) => {
        const prevMealsList = previousMeals.slice(0, 10).map(m => m.food).join(", ");
        const todayMealsList = todayMeals.map(m => m.food).join(", ");
        
        return `You are a nutrition expert. Based on the user's eating patterns, suggest the perfect next meal for them RIGHT NOW.

CONTEXT:
- What they usually eat (last 10 meals): ${prevMealsList || "No history"}
- What they've eaten today: ${todayMealsList || "Nothing yet"}
- Today's totals so far: ${totalCals}cal, P:${totalProt}g C:${totalCarb}g F:${totalFat}g
- Daily goal: 2000cal, P:150g C:225g F:65g

Requirements:
- Suggest ONE specific meal they should eat next
- Consider what they've eaten - suggest variety and complementary nutrients
- Help them hit their daily targets efficiently
- Keep it realistic and something they'd actually eat
- Be specific with portion size

Reply with ONLY this format (no other text):
meal:<specific meal name and portion>
reason:<why this meal is perfect for them right now (25 words max)>`;
      },

      dailyRecap: (meals, totalCals, totalProt, totalCarb, totalFat) => {
        const mealsList = meals.map(m => `${m.food} (${m.calories}cal)`).join(", ");
        
        return `You are a nutrition coach. Analyze this day's eating pattern and provide DEEP, ACTIONABLE insights (not obvious observations).

TODAY'S DATA:
- Meals: ${mealsList}
- Totals: ${totalCals}cal, P:${totalProt}g C:${totalCarb}g F:${totalFat}g
- Goals: 2000cal, P:150g C:225g F:65g

Requirements:
- Give 2-3 specific, non-obvious insights about their eating
- Identify patterns or imbalances only a coach would notice
- Suggest ONE specific adjustment for tonight/tomorrow
- Be concise (50 words max total)
- Skip obvious comments like "you're under calories"

Reply with ONLY this format (no other text):
insight1:<specific insight>
insight2:<specific insight>
suggestion:<one actionable suggestion>`;
      },
    };

    const LoginScreen = ({ onLoggedIn }) => {
      const [apiKey, setApiKey] = useState(localStorage.getItem('fb_apiKey') || '');
      const [projId, setProjId] = useState(localStorage.getItem('fb_projectId') || '');
      const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_apiKey') || '');
      const [status, setStatus] = useState('');
      const [connecting, setConnecting] = useState(false);

      const handleConnect = async () => {
        if (!projId || !apiKey || !geminiKey) {
          setStatus('❌ All three fields required');
          return;
        }
        setConnecting(true);
        setStatus('Connecting...');
        try {
          localStorage.setItem('fb_apiKey', apiKey);
          localStorage.setItem('fb_projectId', projId);
          localStorage.setItem('gemini_apiKey', geminiKey);
          projectId = projId;
          geminiApiKey = geminiKey;
          const user = await firebaseAPI.signIn(apiKey);
          setStatus('✅ Connected!');
          setTimeout(() => onLoggedIn(user), 500);
        } catch (e) {
          setStatus(`❌ ${e.message}`);
          setConnecting(false);
        }
      };

      return (
        <div style={{ minHeight: '100vh', background: '#f5f5f7', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }}>
          <div style={{ background: '#fff', borderRadius: '16px', padding: '2rem', maxWidth: '400px', width: '100%', boxShadow: '0 2px 10px rgba(0,0,0,0.08)' }}>
            <div style={{ fontSize: '3rem', marginBottom: '0.5rem' }}>🌱</div>
            <h1 style={{ fontSize: '1.8rem', fontWeight: '700', marginBottom: '0.5rem', color: '#1d1d1d' }}>Body Tracker</h1>
            <p style={{ color: '#86868b', marginBottom: '2rem', fontSize: '0.9rem' }}>Firebase + Gemini Setup</p>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', marginBottom: '2rem' }}>
              <div>
                <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.4rem', color: '#1d1d1d' }}>Firebase API Key</label>
                <input type="text" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="Firebase API Key" style={{ width: '100%', padding: '0.7rem', border: '1px solid #e5e5ea', borderRadius: '6px', fontSize: '0.8rem', fontFamily: 'monospace' }} />
              </div>
              <div>
                <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.4rem', color: '#1d1d1d' }}>Firebase Project ID</label>
                <input type="text" value={projId} onChange={(e) => setProjId(e.target.value)} placeholder="body-tracker-5347e" style={{ width: '100%', padding: '0.7rem', border: '1px solid #e5e5ea', borderRadius: '6px', fontSize: '0.8rem', fontFamily: 'monospace' }} />
              </div>
              <div>
                <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.4rem', color: '#1d1d1d' }}>Gemini API Key</label>
                <input type="text" value={geminiKey} onChange={(e) => setGeminiKey(e.target.value)} placeholder="Get from ai.google.com" style={{ width: '100%', padding: '0.7rem', border: '1px solid #e5e5ea', borderRadius: '6px', fontSize: '0.8rem', fontFamily: 'monospace' }} />
              </div>
            </div>

            <button onClick={handleConnect} disabled={connecting} style={{ width: '100%', padding: '0.8rem', background: '#34c759', color: 'white', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer', opacity: connecting ? 0.6 : 1 }}>
              {connecting ? 'Connecting...' : 'Connect'}
            </button>

            {status && <div style={{ marginTop: '1rem', padding: '0.75rem', background: status.includes('✅') ? '#f0f9ff' : '#fef2f2', borderRadius: '6px', fontSize: '0.85rem', color: status.includes('✅') ? '#34c759' : '#ff3b30' }}>{status}</div>}

            <div style={{ marginTop: '1.5rem', padding: '1rem', background: '#f9f9fb', borderRadius: '8px', fontSize: '0.75rem', color: '#86868b', lineHeight: '1.5' }}>
              <strong style={{ color: '#1d1d1d' }}>Setup:</strong>
              <ul style={{ marginLeft: '1rem', marginTop: '0.5rem' }}>
                <li>Firebase: Settings → Project settings → Web API Key</li>
                <li>Gemini: Visit ai.google.com → Get API Key</li>
              </ul>
            </div>
          </div>
        </div>
      );
    };

    const App = ({ user }) => {
      const [activeTab, setActiveTab] = useState('today');
      const [entries, setEntries] = useState([]);
      const [foodInput, setFoodInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [appLoading, setAppLoading] = useState(true);
      const [expandedNextMeal, setExpandedNextMeal] = useState(false);
      const [nextMealSuggestion, setNextMealSuggestion] = useState('');
      const [nextMealLoading, setNextMealLoading] = useState(false);
      const [recapData, setRecapData] = useState(null);
      const [historyDays, setHistoryDays] = useState([]);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const today = new Date().toISOString().split('T')[0];
          const data = await firebaseAPI.get(`users/${firebaseUser.uid}/day:${today}`);
          if (data && data.entries) setEntries(data.entries);

          // Load last 10 days of history
          const allDays = [];
          for (let i = 1; i <= 10; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            const dayData = await firebaseAPI.get(`users/${firebaseUser.uid}/day:${dateStr}`);
            if (dayData && dayData.entries) {
              allDays.push(...dayData.entries);
            }
          }
          setHistoryDays(allDays);
        } catch (e) {
          console.error('Load error:', e);
        }
        setAppLoading(false);
      };

      const saveEntries = async (updated) => {
        try {
          const today = new Date().toISOString().split('T')[0];
          await firebaseAPI.set(`users/${firebaseUser.uid}/day:${today}`, { entries: updated });
        } catch (e) {
          console.error('Save error:', e);
        }
      };

      const callGemini = async (prompt) => {
        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${geminiApiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [{ text: prompt }],
                }],
                generationConfig: {
                  maxOutputTokens: 200,
                  temperature: 0.3,
                },
              }),
            }
          );

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || `API error: ${response.status}`);
          }

          const data = await response.json();
          return data.contents[0]?.parts[0]?.text || '';
        } catch (e) {
          console.error('Gemini error:', e);
          throw e;
        }
      };

      const generateNextMealSuggestion = async () => {
        if (nextMealLoading) return;
        setNextMealLoading(true);

        try {
          const totalCals = entries.reduce((s, e) => s + e.calories, 0);
          const totalProt = entries.reduce((s, e) => s + e.protein, 0);
          const totalCarb = entries.reduce((s, e) => s + e.carbs, 0);
          const totalFat = entries.reduce((s, e) => s + e.fat, 0);

          const prompt = PROMPTS.perfectNextMeal(historyDays, entries, totalCals, totalProt, totalCarb, totalFat);
          const text = await callGemini(prompt);

          const mealMatch = text.match(/meal:\s*([^\n]+)/i);
          const reasonMatch = text.match(/reason:\s*([^\n]+)/i);

          setNextMealSuggestion({
            meal: mealMatch?.[1]?.trim() || 'Could not generate suggestion',
            reason: reasonMatch?.[1]?.trim() || '',
          });
        } catch (error) {
          console.error('Error generating suggestion:', error);
          setNextMealSuggestion({ meal: 'Error generating suggestion', reason: '' });
        }
        setNextMealLoading(false);
      };

      const generateDailyRecap = async () => {
        try {
          const totalCals = entries.reduce((s, e) => s + e.calories, 0);
          const totalProt = entries.reduce((s, e) => s + e.protein, 0);
          const totalCarb = entries.reduce((s, e) => s + e.carbs, 0);
          const totalFat = entries.reduce((s, e) => s + e.fat, 0);

          const prompt = PROMPTS.dailyRecap(entries, totalCals, totalProt, totalCarb, totalFat);
          const text = await callGemini(prompt);

          const insight1Match = text.match(/insight1:\s*([^\n]+)/i);
          const insight2Match = text.match(/insight2:\s*([^\n]+)/i);
          const suggestionMatch = text.match(/suggestion:\s*([^\n]+)/i);

          setRecapData({
            insight1: insight1Match?.[1]?.trim() || '',
            insight2: insight2Match?.[1]?.trim() || '',
            suggestion: suggestionMatch?.[1]?.trim() || '',
          });
        } catch (error) {
          console.error('Error generating recap:', error);
        }
      };

      useEffect(() => {
        if (entries.length > 0 && !recapData) {
          generateDailyRecap();
        }
      }, [entries]);

      const logMeal = async () => {
        if (!foodInput.trim()) return;
        setLoading(true);

        try {
          // Step 1: Clean the meal name
          const cleanNamePrompt = PROMPTS.cleanMealName(foodInput);
          const cleanedName = await callGemini(cleanNamePrompt);

          // Step 2: Get nutrition info
          const nutritionPrompt = PROMPTS.textMeal(cleanedName);
          const nutritionText = await callGemini(nutritionPrompt);

          const calMatch = nutritionText.match(/calories:(\d+)/);
          const protMatch = nutritionText.match(/protein:(\d+)g/);
          const carbMatch = nutritionText.match(/carbs:(\d+)g/);
          const fatMatch = nutritionText.match(/fat:(\d+)g/);
          const goodMatch = nutritionText.match(/good:\s*([^\n]+)/i);
          const badMatch = nutritionText.match(/bad:\s*([^\n]+)/i);

          const entry = {
            id: Date.now(),
            food: cleanedName.trim(),
            calories: parseInt(calMatch?.[1] || '0'),
            protein: parseInt(protMatch?.[1] || '0'),
            carbs: parseInt(carbMatch?.[1] || '0'),
            fat: parseInt(fatMatch?.[1] || '0'),
            good: goodMatch?.[1]?.trim() || '',
            bad: badMatch?.[1]?.trim() || '',
            time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
          };

          const updated = [...entries, entry];
          setEntries(updated);
          setFoodInput('');
          setRecapData(null); // Reset recap so it regenerates
          await saveEntries(updated);
        } catch (error) {
          alert('Error: ' + error.message);
        }
        setLoading(false);
      };

      if (appLoading) {
        return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', color: '#86868b' }}>Loading...</div>;
      }

      const totalCal = entries.reduce((s, e) => s + e.calories, 0);
      const totalProt = entries.reduce((s, e) => s + e.protein, 0);
      const totalCarb = entries.reduce((s, e) => s + e.carbs, 0);
      const totalFat = entries.reduce((s, e) => s + e.fat, 0);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: '#f5f5f7' }}>
          <div style={{ flex: 1, overflowY: 'auto', paddingBottom: '70px' }}>
            <div style={{ padding: '1rem', borderBottom: '1px solid #e5e5ea', background: '#fff' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.3rem' }}>
                <div style={{ fontSize: '1.5rem' }}>🌱</div>
                <h1 style={{ fontSize: '1.3rem', fontWeight: '700', color: '#1d1d1d', margin: 0 }}>Body Tracker</h1>
              </div>
              <p style={{ fontSize: '0.75rem', color: '#86868b', margin: 0 }}>✅ Connected</p>
            </div>

            {activeTab === 'today' && (
              <div style={{ padding: '1rem' }}>
                <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.2rem' }}>
                  <input type="text" value={foodInput} onChange={(e) => setFoodInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && logMeal()} placeholder="Log a meal..." style={{ flex: 1, padding: '0.6rem', border: '1px solid #e5e5ea', borderRadius: '6px', fontSize: '0.9rem' }} />
                  <button onClick={logMeal} disabled={loading || !foodInput.trim()} style={{ padding: '0.6rem 1.2rem', background: '#34c759', color: 'white', border: 'none', borderRadius: '6px', fontWeight: '600', cursor: 'pointer', opacity: loading ? 0.6 : 1 }}>
                    {loading ? '...' : 'Log'}
                  </button>
                </div>

                <div style={{ background: '#fff', borderRadius: '12px', padding: '1rem', marginBottom: '1.2rem', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
                  <div style={{ fontSize: '1.5rem', fontWeight: '700', color: totalCal > 2000 ? '#d97757' : '#2c2c2c', marginBottom: '0.5rem' }}>{totalCal}</div>
                  <div style={{ fontSize: '0.75rem', color: '#86868b', marginBottom: '1rem' }}>/ 2000 cal</div>

                  <div style={{ fontSize: '0.7rem', display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                        <span>Protein</span>
                        <strong>{totalProt}g / 150g</strong>
                      </div>
                      <div style={{ height: '4px', background: '#e5e5ea', borderRadius: '2px', overflow: 'hidden' }}>
                        <div style={{ height: '100%', background: '#34c759', width: `${Math.min(100, (totalProt / 150) * 100)}%` }} />
                      </div>
                    </div>
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                        <span>Carbs</span>
                        <strong>{totalCarb}g / 225g</strong>
                      </div>
                      <div style={{ height: '4px', background: '#e5e5ea', borderRadius: '2px', overflow: 'hidden' }}>
                        <div style={{ height: '100%', background: '#34c759', width: `${Math.min(100, (totalCarb / 225) * 100)}%` }} />
                      </div>
                    </div>
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                        <span>Fat</span>
                        <strong>{totalFat}g / 65g</strong>
                      </div>
                      <div style={{ height: '4px', background: '#e5e5ea', borderRadius: '2px', overflow: 'hidden' }}>
                        <div style={{ height: '100%', background: '#34c759', width: `${Math.min(100, (totalFat / 65) * 100)}%` }} />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Insights Section */}
                {recapData && (recapData.insight1 || recapData.insight2) && (
                  <div style={{ background: '#f9f9fb', borderRadius: '12px', padding: '0.9rem', marginBottom: '1.2rem', fontSize: '0.8rem', lineHeight: '1.5', borderLeft: '3px solid #34c759' }}>
                    <div style={{ color: '#1d1d1d', marginBottom: '0.4rem' }}>💡 {recapData.insight1}</div>
                    {recapData.insight2 && <div style={{ color: '#1d1d1d', marginBottom: '0.4rem' }}>💡 {recapData.insight2}</div>}
                    {recapData.suggestion && <div style={{ color: '#34c759', fontWeight: '500', marginTop: '0.6rem' }}>→ {recapData.suggestion}</div>}
                  </div>
                )}

                {/* Perfect Next Meal */}
                <div style={{ background: '#fff', borderRadius: '12px', overflow: 'hidden', marginBottom: '1.2rem', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
                  <button
                    onClick={() => {
                      if (!expandedNextMeal) {
                        generateNextMealSuggestion();
                      }
                      setExpandedNextMeal(!expandedNextMeal);
                    }}
                    style={{ width: '100%', padding: '1rem', background: expandedNextMeal ? '#f9f9fb' : '#fff', border: 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', fontSize: '0.95rem', fontWeight: '600', color: '#1d1d1d' }}
                  >
                    <span>🎯 Perfect next meal</span>
                    <span style={{ transform: expandedNextMeal ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }}>▼</span>
                  </button>

                  {expandedNextMeal && (
                    <div style={{ padding: '1rem', borderTop: '1px solid #e5e5ea' }}>
                      {nextMealLoading ? (
                        <div style={{ color: '#86868b', fontSize: '0.8rem' }}>Generating suggestion...</div>
                      ) : nextMealSuggestion ? (
                        <div>
                          <div style={{ fontSize: '0.95rem', fontWeight: '600', color: '#1d1d1d', marginBottom: '0.4rem' }}>{nextMealSuggestion.meal}</div>
                          {nextMealSuggestion.reason && <div style={{ fontSize: '0.8rem', color: '#86868b', lineHeight: '1.4' }}>💭 {nextMealSuggestion.reason}</div>}
                        </div>
                      ) : null}
                    </div>
                  )}
                </div>

                {entries.length > 0 && (
                  <div>
                    <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: '#1d1d1d', marginBottom: '0.8rem' }}>Meals ({entries.length})</h2>
                    {[...entries].reverse().map((e) => (
                      <div key={e.id} style={{ background: '#fff', borderRadius: '8px', padding: '0.8rem', marginBottom: '0.6rem', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
                        <div style={{ fontWeight: '600', color: '#1d1d1d', marginBottom: '0.3rem' }}>{e.food}</div>
                        <div style={{ fontSize: '0.8rem', color: '#86868b', marginBottom: '0.3rem' }}>{e.calories}cal • P:{e.protein}g C:{e.carbs}g F:{e.fat}g</div>
                        {e.good && <div style={{ fontSize: '0.75rem', color: '#34c759', marginBottom: '0.2rem' }}>✓ {e.good}</div>}
                        {e.bad && <div style={{ fontSize: '0.75rem', color: '#ff3b30' }}>⚠ {e.bad}</div>}
                        <div style={{ fontSize: '0.7rem', color: '#a1a1a6', marginTop: '0.3rem' }}>{e.time}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'history' && (
              <div style={{ padding: '1rem' }}>
                <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: '#1d1d1d', marginBottom: '0.8rem' }}>Meal History</h2>
                {entries.length > 0 ? (
                  <div>
                    {[...entries].reverse().map((e) => (
                      <div key={e.id} style={{ background: '#fff', borderRadius: '8px', padding: '0.8rem', marginBottom: '0.6rem', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
                        <div style={{ fontWeight: '600', color: '#1d1d1d' }}>{e.food}</div>
                        <div style={{ fontSize: '0.8rem', color: '#86868b', marginTop: '0.3rem' }}>{e.calories}cal • P:{e.protein}g C:{e.carbs}g F:{e.fat}g</div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{ textAlign: 'center', color: '#a1a1a6', padding: '2rem' }}>No meals</div>
                )}
              </div>
            )}

            {activeTab === 'body' && (
              <div style={{ padding: '1rem', textAlign: 'center', color: '#a1a1a6' }}>
                <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: '#1d1d1d', marginBottom: '1rem' }}>Body Lab</h2>
                Coming soon...
              </div>
            )}
          </div>

          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: '#fff', borderTop: '1px solid #e5e5ea', display: 'flex', gap: '0.25rem', padding: '0.4rem' }}>
            {['today', 'history', 'body'].map(tab => (
              <button key={tab} onClick={() => setActiveTab(tab)} style={{ flex: 1, padding: '0.6rem', background: activeTab === tab ? '#34c759' : 'transparent', color: activeTab === tab ? 'white' : '#86868b', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: activeTab === tab ? '600' : '500', fontSize: '0.75rem' }}>
                {tab === 'today' && '📋 Today'}
                {tab === 'history' && '📜 History'}
                {tab === 'body' && '💪 Body'}
              </button>
            ))}
          </div>
        </div>
      );
    };

    const Root = () => {
      const [user, setUser] = useState(null);
      return user ? <App user={user} /> : <LoginScreen onLoggedIn={setUser} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
