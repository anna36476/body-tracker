<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body & Nutrition Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.0/dist/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; }
    #root { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase config
    let firebaseUser = null;
    let firebaseIdToken = null;
    let projectId = null;

    const FirebaseAPI = {
      async signIn(apiKey) {
        const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ returnSecureToken: true }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error.message);
        firebaseUser = { uid: data.localId };
        firebaseIdToken = data.idToken;
        return firebaseUser;
      },

      async set(path, value) {
        const url = `https://${projectId}-default-rtdb.firebaseio.com/${path}.json?auth=${firebaseIdToken}`;
        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(value),
        });
        if (!res.ok) throw new Error('Save failed');
        return res.json();
      },

      async get(path) {
        const url = `https://${projectId}-default-rtdb.firebaseio.com/${path}.json?auth=${firebaseIdToken}`;
        const res = await fetch(url);
        if (res.status === 404) return null;
        if (!res.ok) throw new Error('Load failed');
        return res.json();
      },
    };

    const StorageAdapter = {
      async set(key, value) {
        try {
          await FirebaseAPI.set(`users/${firebaseUser.uid}/${key}`, JSON.parse(value));
          return { key, value };
        } catch (e) {
          console.error('Storage error:', e);
          return null;
        }
      },
      async get(key) {
        try {
          const data = await FirebaseAPI.get(`users/${firebaseUser.uid}/${key}`);
          if (data) return { key, value: JSON.stringify(data) };
          return null;
        } catch (e) {
          console.error('Storage error:', e);
          return null;
        }
      },
    };

    const COLORS = {
      background: '#f5f5f7',
      surface: '#ffffff',
      surfaceSecondary: '#f9f9fb',
      textPrimary: '#1d1d1d',
      textSecondary: '#86868b',
      textTertiary: '#a1a1a6',
      accentBlue: '#0071e3',
      accentGreen: '#34c759',
      accentOrange: '#ff9500',
      accentRed: '#ff3b30',
      borderLight: '#e5e5ea',
      shadowLight: 'rgba(0, 0, 0, 0.04)',
    };

    const LoginScreen = ({ onLoggedIn }) => {
      const [creds, setCreds] = useState({
        apiKey: localStorage.getItem('fb_apiKey') || '',
        projectId: localStorage.getItem('fb_projectId') || '',
      });
      const [status, setStatus] = useState('');
      const [connecting, setConnecting] = useState(false);

      const handleConnect = async () => {
        if (!creds.projectId || !creds.apiKey) {
          setStatus('❌ Both fields required');
          return;
        }
        setConnecting(true);
        setStatus('Signing in...');
        try {
          localStorage.setItem('fb_apiKey', creds.apiKey);
          localStorage.setItem('fb_projectId', creds.projectId);
          projectId = creds.projectId;
          const user = await FirebaseAPI.signIn(creds.apiKey);
          setStatus('✅ Connected!');
          setTimeout(() => onLoggedIn(user), 800);
        } catch (e) {
          setStatus(`❌ ${e.message}`);
          setConnecting(false);
        }
      };

      return (
        <div style={{ minHeight: '100vh', background: COLORS.background, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }}>
          <div style={{ background: COLORS.surface, borderRadius: '16px', padding: '2rem', maxWidth: '500px', width: '100%', boxShadow: '0 2px 10px rgba(0,0,0,0.08)' }}>
            <h1 style={{ marginBottom: '0.5rem', fontSize: '2rem', color: COLORS.textPrimary }}>📱 Body Tracker</h1>
            <p style={{ color: COLORS.textSecondary, marginBottom: '2rem' }}>Firebase Login</p>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', marginBottom: '2rem' }}>
              <div>
                <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: '600', marginBottom: '0.4rem' }}>API Key</label>
                <input type="text" value={creds.apiKey} onChange={(e) => setCreds({ ...creds, apiKey: e.target.value })} placeholder="Firebase API Key" style={{ width: '100%', padding: '0.7rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px', fontSize: '0.8rem', fontFamily: 'monospace' }} />
              </div>
              <div>
                <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: '600', marginBottom: '0.4rem' }}>Project ID</label>
                <input type="text" value={creds.projectId} onChange={(e) => setCreds({ ...creds, projectId: e.target.value })} placeholder="Firebase Project ID" style={{ width: '100%', padding: '0.7rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px', fontSize: '0.8rem', fontFamily: 'monospace' }} />
              </div>
            </div>

            <button onClick={handleConnect} disabled={connecting || !creds.projectId || !creds.apiKey} style={{ width: '100%', padding: '0.8rem', background: COLORS.accentBlue, color: 'white', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: connecting ? 'not-allowed' : 'pointer', opacity: connecting ? 0.6 : 1 }}>
              {connecting ? 'Connecting...' : 'Connect to Firebase'}
            </button>

            {status && <div style={{ marginTop: '1rem', padding: '0.75rem', background: status.includes('✅') ? '#f0f9ff' : '#fef2f2', borderRadius: '6px', fontSize: '0.9rem', color: status.includes('✅') ? COLORS.accentBlue : COLORS.accentRed }}>{status}</div>}
          </div>
        </div>
      );
    };

    const App = ({ user }) => {
      const [activeTab, setActiveTab] = useState('today');
      const [entries, setEntries] = useState([]);
      const [foodInput, setFoodInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [photoPreviews, setPhotoPreviews] = useState([]);
      const [appLoading, setAppLoading] = useState(true);
      const [bodyLog, setBodyLog] = useState([]);
      const [bodyForm, setBodyForm] = useState({ weight: '', height: '', age: '', sex: 'female', activityLevel: 'moderate', goal: 'maintain', goalRate: 'moderate', muscleMass: '', bodyFat: '' });
      const [nextMealSuggestion, setNextMealSuggestion] = useState('');
      const [nextMealLoading, setNextMealLoading] = useState(false);
      const [supportMessages, setSupportMessages] = useState([]);
      const [supportInput, setSupportInput] = useState('');
      const [supportLoading, setSupportLoading] = useState(false);
      const photoInputRef = useRef(null);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const entriesData = await StorageAdapter.get('entries');
          if (entriesData) setEntries(JSON.parse(entriesData.value));
          const bodyData = await StorageAdapter.get('body-log');
          if (bodyData) setBodyLog(JSON.parse(bodyData.value));
          const mealsData = await StorageAdapter.get('next-meal');
          if (mealsData) setNextMealSuggestion(mealsData.value);
        } catch (e) {
          console.error('Load error:', e);
        }
        setAppLoading(false);
      };

      const handlePhotoSelect = (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        const newPreviews = files.map(file => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(file);
          });
        });
        Promise.all(newPreviews).then(previews => {
          setPhotoPreviews(prev => [...prev, ...previews]);
        });
      };

      const removePhoto = (index) => {
        setPhotoPreviews(photoPreviews.filter((_, i) => i !== index));
      };

      const logMeal = async () => {
        const noteText = foodInput.trim();
        const hasPhotos = photoPreviews.length > 0;
        const hasText = noteText.length > 0;
        if (!hasPhotos && !hasText) return;
        setLoading(true);
        try {
          const newEntries = [];
          if (hasPhotos) {
            for (const photoPreview of photoPreviews) {
              const notePart = hasText ? ` The person also added this note: "${noteText}". Use the note together with the photo.` : '';
              const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-6',
                  max_tokens: 150,
                  messages: [{
                    role: 'user',
                    content: [
                      {
                        type: 'image',
                        source: {
                          type: 'base64',
                          media_type: 'image/jpeg',
                          data: photoPreview.split(',')[1],
                        },
                      },
                      {
                        type: 'text',
                        text: `Analyze this meal photo.${notePart} Reply ONLY:
description:<3-6 word description>
calories:XXX | protein:XXg | carbs:XXg | fat:XXg
good:<one positive thing>
bad:<one area to improve>`,
                      },
                    ],
                  }],
                }),
              });
              const data = await response.json();
              const text = data.content[0]?.text || '';
              const descriptionMatch = text.match(/description:\s*(.*)/i);
              const calorieMatch = text.match(/calories:(\d+)/);
              const proteinMatch = text.match(/protein:(\d+)g/);
              const carbsMatch = text.match(/carbs:(\d+)g/);
              const fatMatch = text.match(/fat:(\d+)g/);
              const goodMatch = text.match(/good:\s*(.*)/i);
              const badMatch = text.match(/bad:\s*(.*)/i);
              const description = descriptionMatch?.[1]?.trim() || 'Logged meal';
              newEntries.push({
                id: Date.now() + Math.random(),
                food: description,
                image: photoPreview,
                calories: parseInt(calorieMatch?.[1] || '0', 10),
                protein: parseInt(proteinMatch?.[1] || '0', 10),
                carbs: parseInt(carbsMatch?.[1] || '0', 10),
                fat: parseInt(fatMatch?.[1] || '0', 10),
                mealGood: goodMatch?.[1]?.trim() || '',
                mealBad: badMatch?.[1]?.trim() || '',
                timestamp: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
              });
            }
          } else {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-6',
                max_tokens: 150,
                messages: [{
                  role: 'user',
                  content: `Estimate: "${noteText}". Reply ONLY:
calories:XXX | protein:XXg | carbs:XXg | fat:XXg
good:<positive>
bad:<improve>`,
                }],
              }),
            });
            const data = await response.json();
            const text = data.content[0]?.text || '';
            const calorieMatch = text.match(/calories:(\d+)/);
            const proteinMatch = text.match(/protein:(\d+)g/);
            const carbsMatch = text.match(/carbs:(\d+)g/);
            const fatMatch = text.match(/fat:(\d+)g/);
            const goodMatch = text.match(/good:\s*(.*)/i);
            const badMatch = text.match(/bad:\s*(.*)/i);
            newEntries.push({
              id: Date.now(),
              food: noteText,
              calories: parseInt(calorieMatch?.[1] || '0', 10),
              protein: parseInt(proteinMatch?.[1] || '0', 10),
              carbs: parseInt(carbsMatch?.[1] || '0', 10),
              fat: parseInt(fatMatch?.[1] || '0', 10),
              mealGood: goodMatch?.[1]?.trim() || '',
              mealBad: badMatch?.[1]?.trim() || '',
              timestamp: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
            });
          }
          const updated = [...entries, ...newEntries];
          setEntries(updated);
          setFoodInput('');
          setPhotoPreviews([]);
          await StorageAdapter.set('entries', JSON.stringify(updated));
        } catch (error) {
          console.error('Error:', error);
          alert('Error logging meal');
        }
        setLoading(false);
      };

      const generateNextMeal = async () => {
        setNextMealLoading(true);
        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 150,
              messages: [{
                role: 'user',
                content: `Suggest a next meal that's balanced and healthy. Reply ONLY:
MEAL: <name>
MACROS: <target macros>
PREP: <quick prep time>
WHY: <why this is good>`,
              }],
            }),
          });
          const data = await response.json();
          const text = data.content[0]?.text || '';
          setNextMealSuggestion(text);
          await StorageAdapter.set('next-meal', text);
        } catch (e) {
          console.error('Error:', e);
        }
        setNextMealLoading(false);
      };

      const saveBodyEntry = async () => {
        if (!bodyForm.weight) { alert('Weight is required'); return; }
        try {
          const entry = { id: Date.now(), ...bodyForm, timestamp: new Date().toLocaleString() };
          const updated = [...bodyLog, entry];
          setBodyLog(updated);
          setBodyForm({ weight: '', height: '', age: '', sex: 'female', activityLevel: 'moderate', goal: 'maintain', goalRate: 'moderate', muscleMass: '', bodyFat: '' });
          await StorageAdapter.set('body-log', JSON.stringify(updated));
        } catch (e) {
          console.error('Error:', e);
          alert('Error saving');
        }
      };

      const sendSupport = async () => {
        if (!supportInput.trim()) return;
        setSupportLoading(true);
        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 200,
              messages: [{
                role: 'user',
                content: `User asking about nutrition/fitness: "${supportInput}". Provide helpful, friendly advice.`,
              }],
            }),
          });
          const data = await response.json();
          const reply = data.content[0]?.text || '';
          const newMessages = [...supportMessages, { user: supportInput, assistant: reply }];
          setSupportMessages(newMessages);
          setSupportInput('');
          await StorageAdapter.set('support-messages', JSON.stringify(newMessages));
        } catch (e) {
          console.error('Error:', e);
        }
        setSupportLoading(false);
      };

      if (appLoading) {
        return <div style={{ minHeight: '100vh', background: COLORS.background, display: 'flex', alignItems: 'center', justifyContent: 'center', color: COLORS.textSecondary }}>Loading...</div>;
      }

      return (
        <div style={{ minHeight: '100vh', background: COLORS.background, paddingBottom: '80px' }}>
          <div style={{ padding: '1rem', borderBottom: `1px solid ${COLORS.borderLight}`, background: COLORS.surface }}>
            <h1 style={{ fontSize: '1.5rem', fontWeight: '700', color: COLORS.textPrimary }}>📱 Body & Nutrition Tracker</h1>
            <p style={{ fontSize: '0.8rem', color: COLORS.textSecondary, marginTop: '0.3rem' }}>✅ Firebase Connected</p>
          </div>

          <div style={{ padding: '1rem' }}>
            {activeTab === 'today' && (
              <div>
                <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}>
                  <input type="text" value={foodInput} onChange={(e) => setFoodInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && logMeal()} placeholder="Log a meal..." style={{ flex: 1, padding: '0.7rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '8px', fontSize: '0.9rem' }} />
                  <button onClick={logMeal} disabled={loading || (!foodInput.trim() && !photoPreviews.length)} style={{ padding: '0.7rem 1.2rem', background: COLORS.accentBlue, color: 'white', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: loading ? 'not-allowed' : 'pointer', opacity: loading ? 0.6 : 1 }}>
                    {loading ? '...' : 'Log'}
                  </button>
                </div>

                {photoPreviews.length > 0 && (
                  <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                    {photoPreviews.map((preview, idx) => (
                      <div key={idx} style={{ position: 'relative', width: '50px', height: '50px' }}>
                        <img src={preview} alt="" style={{ width: '50px', height: '50px', borderRadius: '6px', objectFit: 'cover' }} />
                        <button onClick={() => removePhoto(idx)} style={{ position: 'absolute', top: '-8px', right: '-8px', width: '20px', height: '20px', borderRadius: '50%', background: COLORS.accentRed, color: 'white', border: 'none', cursor: 'pointer', fontSize: '12px' }}>×</button>
                      </div>
                    ))}
                  </div>
                )}

                <input ref={photoInputRef} type="file" accept="image/*" multiple onChange={handlePhotoSelect} style={{ display: 'none' }} />
                <button onClick={() => photoInputRef.current?.click()} style={{ marginBottom: '1rem', padding: '0.6rem 1rem', background: COLORS.surfaceSecondary, border: `1px solid ${COLORS.borderLight}`, borderRadius: '8px', cursor: 'pointer', fontSize: '0.9rem' }}>📷 Add Photos</button>

                {entries.length > 0 ? (
                  <div>
                    <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: COLORS.textSecondary, marginBottom: '1rem' }}>Meals ({entries.length})</h2>
                    {[...entries].reverse().map((e) => (
                      <div key={e.id} style={{ background: COLORS.surface, boxShadow: `0 1px 3px ${COLORS.shadowLight}`, borderRadius: '8px', padding: '1rem', marginBottom: '0.8rem' }}>
                        {e.image && <img src={e.image} alt="" style={{ width: '100%', height: '150px', borderRadius: '6px', objectFit: 'cover', marginBottom: '0.5rem' }} />}
                        <div style={{ fontWeight: '600', color: COLORS.textPrimary }}>{e.food}</div>
                        <div style={{ fontSize: '0.85rem', color: COLORS.textSecondary, marginTop: '0.3rem' }}>
                          {e.calories}cal • P:{e.protein}g C:{e.carbs}g F:{e.fat}g
                        </div>
                        {e.mealGood && <div style={{ fontSize: '0.75rem', color: COLORS.accentGreen, marginTop: '0.3rem' }}>✓ {e.mealGood}</div>}
                        {e.mealBad && <div style={{ fontSize: '0.75rem', color: COLORS.accentRed, marginTop: '0.2rem' }}>⚠ {e.mealBad}</div>}
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{ textAlign: 'center', padding: '3rem 1rem', color: COLORS.textTertiary }}>No meals logged yet</div>
                )}

                <div style={{ marginTop: '2rem', background: COLORS.surface, boxShadow: `0 1px 3px ${COLORS.shadowLight}`, borderRadius: '8px', padding: '1rem' }}>
                  <h3 style={{ fontSize: '0.9rem', fontWeight: '600', color: COLORS.textPrimary, marginBottom: '0.5rem' }}>💡 Perfect Next Meal</h3>
                  {nextMealSuggestion ? (
                    <pre style={{ fontSize: '0.75rem', color: COLORS.textSecondary, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{nextMealSuggestion}</pre>
                  ) : (
                    <p style={{ fontSize: '0.85rem', color: COLORS.textTertiary }}>No suggestion yet</p>
                  )}
                  <button onClick={generateNextMeal} disabled={nextMealLoading} style={{ marginTop: '0.5rem', padding: '0.5rem 1rem', background: COLORS.accentBlue, color: 'white', border: 'none', borderRadius: '6px', fontSize: '0.75rem', cursor: nextMealLoading ? 'not-allowed' : 'pointer' }}>
                    {nextMealLoading ? 'Generating...' : 'Generate Suggestion'}
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'body' && (
              <div>
                <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: COLORS.textSecondary, marginBottom: '1rem' }}>Body Composition</h2>
                <div style={{ background: COLORS.surface, boxShadow: `0 1px 3px ${COLORS.shadowLight}`, borderRadius: '8px', padding: '1rem', marginBottom: '1rem' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.8rem', marginBottom: '1rem' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.3rem' }}>Weight (kg)</label>
                      <input type="number" value={bodyForm.weight} onChange={(e) => setBodyForm({ ...bodyForm, weight: e.target.value })} style={{ width: '100%', padding: '0.5rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.3rem' }}>Height (cm)</label>
                      <input type="number" value={bodyForm.height} onChange={(e) => setBodyForm({ ...bodyForm, height: e.target.value })} style={{ width: '100%', padding: '0.5rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.3rem' }}>Muscle Mass (kg)</label>
                      <input type="number" value={bodyForm.muscleMass} onChange={(e) => setBodyForm({ ...bodyForm, muscleMass: e.target.value })} style={{ width: '100%', padding: '0.5rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: '600', marginBottom: '0.3rem' }}>Body Fat (%)</label>
                      <input type="number" value={bodyForm.bodyFat} onChange={(e) => setBodyForm({ ...bodyForm, bodyFat: e.target.value })} style={{ width: '100%', padding: '0.5rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px' }} />
                    </div>
                  </div>
                  <button onClick={saveBodyEntry} style={{ width: '100%', padding: '0.6rem', background: COLORS.accentBlue, color: 'white', border: 'none', borderRadius: '6px', fontWeight: '600', cursor: 'pointer' }}>Save Entry</button>
                </div>
                {bodyLog.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: '0.85rem', fontWeight: '600', color: COLORS.textSecondary, marginBottom: '0.8rem' }}>History ({bodyLog.length})</h3>
                    {[...bodyLog].reverse().map((entry) => (
                      <div key={entry.id} style={{ background: COLORS.surface, boxShadow: `0 1px 3px ${COLORS.shadowLight}`, borderRadius: '8px', padding: '0.75rem', marginBottom: '0.6rem', fontSize: '0.8rem' }}>
                        <div style={{ fontWeight: '600', color: COLORS.textPrimary }}>{entry.weight}kg {entry.height ? `• ${entry.height}cm` : ''}</div>
                        <div style={{ color: COLORS.textSecondary, marginTop: '0.2rem' }}>{entry.timestamp}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'support' && (
              <div>
                <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: COLORS.textSecondary, marginBottom: '1rem' }}>💬 Support Chat</h2>
                <div style={{ height: '300px', overflow: 'auto', background: COLORS.surface, borderRadius: '8px', padding: '1rem', marginBottom: '1rem', boxShadow: `0 1px 3px ${COLORS.shadowLight}` }}>
                  {supportMessages.length === 0 ? (
                    <p style={{ color: COLORS.textTertiary, fontSize: '0.85rem' }}>No messages yet</p>
                  ) : (
                    supportMessages.map((msg, idx) => (
                      <div key={idx} style={{ marginBottom: '1rem' }}>
                        <div style={{ background: COLORS.accentBlue, color: 'white', padding: '0.5rem', borderRadius: '6px', marginBottom: '0.3rem', fontSize: '0.8rem' }}>{msg.user}</div>
                        <div style={{ background: COLORS.surfaceSecondary, padding: '0.5rem', borderRadius: '6px', fontSize: '0.8rem', color: COLORS.textSecondary }}>{msg.assistant}</div>
                      </div>
                    ))
                  )}
                </div>
                <div style={{ display: 'flex', gap: '0.5rem' }}>
                  <input type="text" value={supportInput} onChange={(e) => setSupportInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && sendSupport()} placeholder="Ask a question..." style={{ flex: 1, padding: '0.6rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px' }} />
                  <button onClick={sendSupport} disabled={supportLoading || !supportInput.trim()} style={{ padding: '0.6rem 1rem', background: COLORS.accentBlue, color: 'white', border: 'none', borderRadius: '6px', cursor: supportLoading ? 'not-allowed' : 'pointer' }}>
                    {supportLoading ? '...' : 'Send'}
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'history' && (
              <div>
                <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: COLORS.textSecondary, marginBottom: '1rem' }}>📋 Meal History</h2>
                {entries.length > 0 ? (
                  <div>
                    {[...entries].reverse().map((e) => (
                      <div key={e.id} style={{ background: COLORS.surface, boxShadow: `0 1px 3px ${COLORS.shadowLight}`, borderRadius: '8px', padding: '0.75rem', marginBottom: '0.6rem' }}>
                        <div style={{ fontWeight: '600', color: COLORS.textPrimary, fontSize: '0.9rem' }}>{e.food}</div>
                        <div style={{ fontSize: '0.8rem', color: COLORS.textSecondary, marginTop: '0.3rem' }}>{e.calories}cal • P:{e.protein}g C:{e.carbs}g F:{e.fat}g</div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{ textAlign: 'center', padding: '2rem', color: COLORS.textTertiary }}>No meal history</div>
                )}
              </div>
            )}
          </div>

          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: COLORS.surface, borderTop: `1px solid ${COLORS.borderLight}`, display: 'flex', gap: '0.5rem', padding: '0.5rem' }}>
            {['today', 'history', 'body', 'support'].map(tab => (
              <button key={tab} onClick={() => setActiveTab(tab)} style={{ flex: 1, padding: '0.6rem', background: activeTab === tab ? COLORS.accentBlue : 'transparent', color: activeTab === tab ? 'white' : COLORS.textSecondary, border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: activeTab === tab ? '600' : '500', fontSize: '0.7rem' }}>
                {tab.charAt(0).toUpperCase() + tab.slice(1)}
              </button>
            ))}
          </div>
        </div>
      );
    };

    const Root = () => {
      const [user, setUser] = useState(null);
      return user ? <App user={user} /> : <LoginScreen onLoggedIn={setUser} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
