<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body & Nutrition Tracker</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script async src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script async src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
  <script async src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; }
    #root { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const COLORS = {
      background: '#f5f5f7',
      surface: '#ffffff',
      textPrimary: '#1d1d1d',
      textSecondary: '#86868b',
      textTertiary: '#a1a1a6',
      accentBlue: '#0071e3',
      accentRed: '#ff3b30',
      borderLight: '#e5e5ea',
      shadowLight: 'rgba(0, 0, 0, 0.04)',
    };

    let db = null;
    let auth = null;
    let currentUser = null;

    const StorageAdapter = {
      async set(key, value, shared = false) {
        try {
          localStorage.setItem(`local_${key}`, value);
          if (currentUser && db) {
            const uid = currentUser.uid;
            const path = shared ? `shared/${key}` : `users/${uid}/${key}`;
            await db.ref(path).set(value);
          }
          return { key, value, shared };
        } catch (e) {
          console.error('Storage error:', e);
          return null;
        }
      },

      async get(key, shared = false) {
        try {
          if (currentUser && db) {
            const uid = currentUser.uid;
            const path = shared ? `shared/${key}` : `users/${uid}/${key}`;
            const snap = await db.ref(path).get();
            const val = snap.val();
            if (val !== null) {
              localStorage.setItem(`local_${key}`, val);
              return { key, value: val, shared };
            }
          }
          const cached = localStorage.getItem(`local_${key}`);
          return cached ? { key, value: cached, shared } : null;
        } catch (e) {
          const cached = localStorage.getItem(`local_${key}`);
          return cached ? { key, value: cached, shared } : null;
        }
      },

      async delete(key, shared = false) {
        try {
          localStorage.removeItem(`local_${key}`);
          if (currentUser && db) {
            const uid = currentUser.uid;
            const path = shared ? `shared/${key}` : `users/${uid}/${key}`;
            await db.ref(path).remove();
          }
          return { key, deleted: true };
        } catch (e) {
          return null;
        }
      },
    };

    // Login Screen
    const LoginScreen = ({ onLoggedIn, firebaseReady }) => {
      const [creds, setCreds] = useState({
        apiKey: localStorage.getItem('fb_apiKey') || '',
        authDomain: localStorage.getItem('fb_authDomain') || '',
        projectId: localStorage.getItem('fb_projectId') || '',
        storageBucket: localStorage.getItem('fb_storageBucket') || '',
        messagingSenderId: localStorage.getItem('fb_messagingSenderId') || '',
        appId: localStorage.getItem('fb_appId') || '',
      });
      const [status, setStatus] = useState('');
      const [connecting, setConnecting] = useState(false);

      const handleConnect = async () => {
        if (!creds.projectId) {
          setStatus('❌ Project ID required');
          return;
        }
        if (!firebaseReady) {
          setStatus('❌ Firebase SDK not ready');
          return;
        }

        setConnecting(true);
        setStatus('Connecting...');

        try {
          Object.keys(creds).forEach(k => localStorage.setItem(`fb_${k}`, creds[k]));

          const config = {
            apiKey: creds.apiKey,
            authDomain: creds.authDomain,
            projectId: creds.projectId,
            storageBucket: creds.storageBucket,
            messagingSenderId: creds.messagingSenderId,
            appId: creds.appId,
            databaseURL: `https://${creds.projectId}-default-rtdb.firebaseio.com`,
          };

          const app = firebase.initializeApp(config, 'app-' + Date.now());
          db = firebase.database(app);
          auth = firebase.auth(app);

          const result = await auth.signInAnonymously();
          currentUser = result.user;

          setStatus('✅ Connected!');
          setTimeout(() => onLoggedIn(currentUser), 500);
        } catch (err) {
          console.error('Error:', err);
          setStatus(`❌ ${err.message || 'Connection failed'}`);
          setConnecting(false);
        }
      };

      return (
        <div style={{ minHeight: '100vh', background: COLORS.background, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }}>
          <div style={{ background: COLORS.surface, borderRadius: '16px', padding: '2rem', maxWidth: '500px', width: '100%', boxShadow: '0 2px 10px rgba(0,0,0,0.08)' }}>
            <h1 style={{ marginBottom: '0.5rem', fontSize: '2rem', color: COLORS.textPrimary }}>📱 Body Tracker</h1>
            <p style={{ color: COLORS.textSecondary, marginBottom: '2rem' }}>Firebase Setup</p>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', marginBottom: '2rem' }}>
              {['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].map(k => (
                <div key={k}>
                  <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: '600', marginBottom: '0.4rem', color: COLORS.textPrimary }}>{k}</label>
                  <input
                    type="text"
                    value={creds[k]}
                    onChange={(e) => setCreds({ ...creds, [k]: e.target.value })}
                    placeholder={k}
                    style={{ width: '100%', padding: '0.7rem', border: `1px solid ${COLORS.borderLight}`, borderRadius: '6px', fontSize: '0.8rem', fontFamily: 'monospace' }}
                  />
                </div>
              ))}
            </div>

            <button
              onClick={handleConnect}
              disabled={connecting || !creds.projectId || !firebaseReady}
              style={{
                width: '100%',
                padding: '0.8rem',
                background: COLORS.accentBlue,
                color: 'white',
                border: 'none',
                borderRadius: '8px',
                fontWeight: '600',
                cursor: connecting ? 'not-allowed' : 'pointer',
                opacity: connecting || !firebaseReady ? 0.6 : 1,
              }}
            >
              {connecting ? 'Connecting...' : 'Connect Firebase'}
            </button>

            {status && (
              <div style={{
                marginTop: '1rem',
                padding: '0.75rem',
                background: status.includes('✅') ? '#f0f9ff' : '#fef2f2',
                borderRadius: '6px',
                fontSize: '0.9rem',
                color: status.includes('✅') ? COLORS.accentBlue : COLORS.accentRed,
              }}>
                {status}
              </div>
            )}

            {!firebaseReady && (
              <div style={{ marginTop: '1rem', padding: '0.75rem', background: '#fffbf0', borderRadius: '6px', fontSize: '0.85rem', color: '#f4a957' }}>
                ⏳ Loading Firebase...
              </div>
            )}
          </div>
        </div>
      );
    };

    // App
    const App = ({ user }) => {
      const [entries, setEntries] = useState([]);
      const [foodInput, setFoodInput] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        const data = localStorage.getItem('local_entries');
        if (data) setEntries(JSON.parse(data));
      }, []);

      const logMeal = async () => {
        if (!foodInput.trim()) return;
        setLoading(true);

        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 100,
              messages: [{ role: 'user', content: `Estimate calories for: "${foodInput}". Reply: calories:X protein:Xg carbs:Xg fat:Xg` }],
            }),
          });

          const data = await res.json();
          const text = data.content[0]?.text || '';

          const entry = {
            id: Date.now(),
            food: foodInput,
            calories: parseInt(text.match(/calories:(\d+)/)?.[1] || '0'),
            protein: parseInt(text.match(/protein:(\d+)/)?.[1] || '0'),
            carbs: parseInt(text.match(/carbs:(\d+)/)?.[1] || '0'),
            fat: parseInt(text.match(/fat:(\d+)/)?.[1] || '0'),
            time: new Date().toLocaleString(),
          };

          const updated = [...entries, entry];
          setEntries(updated);
          setFoodInput('');
          localStorage.setItem('local_entries', JSON.stringify(updated));
          await StorageAdapter.set('entries', JSON.stringify(updated), false);
        } catch (e) {
          alert('Error logging meal: ' + e.message);
        }
        setLoading(false);
      };

      return (
        <div style={{ minHeight: '100vh', background: COLORS.background }}>
          <div style={{ padding: '1rem', borderBottom: `1px solid ${COLORS.borderLight}`, background: COLORS.surface }}>
            <h1 style={{ fontSize: '1.5rem', fontWeight: '700', color: COLORS.textPrimary }}>📱 Body Tracker</h1>
            <p style={{ fontSize: '0.8rem', color: COLORS.textSecondary, marginTop: '0.3rem' }}>✅ Connected (UID: {user?.uid?.slice(0, 8)}...)</p>
          </div>

          <div style={{ padding: '1rem', paddingBottom: '100px' }}>
            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem' }}>
              <input
                type="text"
                value={foodInput}
                onChange={(e) => setFoodInput(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && logMeal()}
                placeholder="Log a meal..."
                style={{
                  flex: 1,
                  padding: '0.7rem',
                  border: `1px solid ${COLORS.borderLight}`,
                  borderRadius: '8px',
                  fontSize: '0.9rem',
                }}
              />
              <button
                onClick={logMeal}
                disabled={loading || !foodInput.trim()}
                style={{
                  padding: '0.7rem 1.2rem',
                  background: COLORS.accentBlue,
                  color: 'white',
                  border: 'none',
                  borderRadius: '8px',
                  fontWeight: '600',
                  cursor: loading ? 'not-allowed' : 'pointer',
                  opacity: loading ? 0.6 : 1,
                }}
              >
                {loading ? '...' : 'Log'}
              </button>
            </div>

            {entries.length > 0 ? (
              <div>
                <h2 style={{ fontSize: '0.9rem', fontWeight: '600', color: COLORS.textSecondary, marginBottom: '1rem' }}>Meals ({entries.length})</h2>
                {[...entries].reverse().map((e) => (
                  <div key={e.id} style={{
                    background: COLORS.surface,
                    boxShadow: `0 1px 3px ${COLORS.shadowLight}`,
                    borderRadius: '8px',
                    padding: '1rem',
                    marginBottom: '0.8rem',
                  }}>
                    <div style={{ fontWeight: '600', color: COLORS.textPrimary }}>{e.food}</div>
                    <div style={{ fontSize: '0.85rem', color: COLORS.textSecondary, marginTop: '0.3rem' }}>
                      {e.calories}cal • P:{e.protein}g C:{e.carbs}g F:{e.fat}g
                    </div>
                    <div style={{ fontSize: '0.75rem', color: COLORS.textTertiary, marginTop: '0.3rem' }}>{e.time}</div>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ textAlign: 'center', padding: '3rem 1rem', color: COLORS.textTertiary }}>
                <p>No meals logged yet</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Root
    const Root = () => {
      const [user, setUser] = useState(null);
      const [firebaseReady, setFirebaseReady] = useState(false);
      const [timedOut, setTimedOut] = useState(false);

      useEffect(() => {
        const timeout = setTimeout(() => {
          if (!window.firebase) {
            setTimedOut(true);
          }
        }, 8000);

        const interval = setInterval(() => {
          if (window.firebase?.initializeApp) {
            setFirebaseReady(true);
            clearInterval(interval);
            clearTimeout(timeout);
          }
        }, 100);

        return () => {
          clearInterval(interval);
          clearTimeout(timeout);
        };
      }, []);

      if (timedOut) {
        return (
          <div style={{
            minHeight: '100vh',
            background: COLORS.background,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '1rem',
          }}>
            <div style={{
              background: COLORS.surface,
              borderRadius: '16px',
              padding: '2rem',
              maxWidth: '400px',
              textAlign: 'center',
              boxShadow: '0 2px 10px rgba(0,0,0,0.08)',
            }}>
              <h2 style={{ color: COLORS.accentRed, marginBottom: '1rem' }}>⚠️ Connection Issue</h2>
              <p style={{ color: COLORS.textSecondary, marginBottom: '1rem' }}>
                Firebase SDK failed to load. This might be a network issue.
              </p>
              <button
                onClick={() => window.location.reload()}
                style={{
                  width: '100%',
                  padding: '0.75rem',
                  background: COLORS.accentBlue,
                  color: 'white',
                  border: 'none',
                  borderRadius: '8px',
                  fontWeight: '600',
                  cursor: 'pointer',
                }}
              >
                Refresh Page
              </button>
            </div>
          </div>
        );
      }

      return user ? <App user={user} /> : <LoginScreen onLoggedIn={setUser} firebaseReady={firebaseReady} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
