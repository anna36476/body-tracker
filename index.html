<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body & Nutrition Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { LineChart, Line, BarChart, Bar, CartesianGrid, XAxis, YAxis, ResponsiveContainer, Tooltip } = Recharts;

    // ============================================
    // FIREBASE SETUP - CONFIGURE WITH YOUR KEYS
    // ============================================
    let db = null;
    let auth = null;

    const initializeFirebase = () => {
      try {
        // Get these from your Firebase console (see instructions below)
        const firebaseConfig = {
          apiKey: localStorage.getItem('firebase_apiKey') || '',
          authDomain: localStorage.getItem('firebase_authDomain') || '',
          projectId: localStorage.getItem('firebase_projectId') || '',
          storageBucket: localStorage.getItem('firebase_storageBucket') || '',
          messagingSenderId: localStorage.getItem('firebase_messagingSenderId') || '',
          appId: localStorage.getItem('firebase_appId') || '',
        };

        if (!firebaseConfig.apiKey) return null;

        const app = firebase.initializeApp(firebaseConfig, 'app-' + Date.now());
        db = firebase.database(app);
        auth = firebase.auth(app);
        return { db, auth };
      } catch (error) {
        console.error('Firebase init error:', error);
        return null;
      }
    };

    // ============================================
    // STORAGE ADAPTER (Firebase or Local)
    // ============================================
    const StorageAdapter = {
      async set(key, value, shared = false) {
        try {
          if (auth && auth.currentUser && db) {
            const userId = auth.currentUser.uid;
            const path = shared ? `shared/${key}` : `users/${userId}/${key}`;
            await db.ref(path).set(value);
            localStorage.setItem(`cache_${key}`, value);
            return { key, value, shared };
          } else {
            localStorage.setItem(`cache_${key}`, value);
            return { key, value, shared };
          }
        } catch (error) {
          console.error('Storage set error:', error);
          return null;
        }
      },

      async get(key, shared = false) {
        try {
          if (auth && auth.currentUser && db) {
            const userId = auth.currentUser.uid;
            const path = shared ? `shared/${key}` : `users/${userId}/${key}`;
            const snapshot = await db.ref(path).get();
            const value = snapshot.val();
            if (value) {
              localStorage.setItem(`cache_${key}`, value);
              return { key, value, shared };
            }
          }
          // Fallback to local cache
          const cached = localStorage.getItem(`cache_${key}`);
          if (cached) return { key, value: cached, shared };
          return null;
        } catch (error) {
          console.error('Storage get error:', error);
          return null;
        }
      },

      async delete(key, shared = false) {
        try {
          if (auth && auth.currentUser && db) {
            const userId = auth.currentUser.uid;
            const path = shared ? `shared/${key}` : `users/${userId}/${key}`;
            await db.ref(path).remove();
          }
          localStorage.removeItem(`cache_${key}`);
          return { key, deleted: true, shared };
        } catch (error) {
          console.error('Storage delete error:', error);
          return null;
        }
      },

      async list(prefix = '', shared = false) {
        try {
          if (auth && auth.currentUser && db) {
            const userId = auth.currentUser.uid;
            const path = shared ? `shared` : `users/${userId}`;
            const snapshot = await db.ref(path).get();
            const data = snapshot.val() || {};
            const keys = Object.keys(data).filter(k => k.startsWith(prefix));
            return { keys, prefix, shared };
          }
          // Fallback: list cached keys
          const keys = Object.keys(localStorage).filter(k => k.startsWith(`cache_${prefix}`)).map(k => k.replace('cache_', ''));
          return { keys, prefix, shared };
        } catch (error) {
          console.error('Storage list error:', error);
          return null;
        }
      }
    };

    // ============================================
    // LOGIN SCREEN COMPONENT
    // ============================================
    const LoginScreen = ({ onSetupComplete }) => {
      const [step, setStep] = useState('guide'); // 'guide', 'credentials', 'testing'
      const [credentials, setCredentials] = useState({
        apiKey: '',
        authDomain: '',
        projectId: '',
        storageBucket: '',
        messagingSenderId: '',
        appId: '',
      });
      const [testing, setTesting] = useState(false);
      const [testMessage, setTestMessage] = useState('');

      const handleSaveCredentials = () => {
        if (!credentials.projectId) {
          setTestMessage('❌ Project ID is required');
          return;
        }
        Object.keys(credentials).forEach(key => {
          localStorage.setItem(`firebase_${key}`, credentials[key]);
        });
        const result = initializeFirebase();
        if (result) {
          setTesting(true);
          testConnection();
        } else {
          setTestMessage('❌ Failed to initialize Firebase');
        }
      };

      const testConnection = async () => {
        try {
          setTestMessage('Testing connection...');
          await firebase.auth().signInAnonymously();
          setTestMessage('✅ Firebase connected! Signing you in...');
          setTimeout(() => onSetupComplete(), 1500);
        } catch (error) {
          setTestMessage(`❌ Connection failed: ${error.message}`);
        }
      };

      if (step === 'guide') {
        return (
          <div style={{ padding: '2rem', maxWidth: '600px', margin: '0 auto' }}>
            <h1 style={{ marginBottom: '1.5rem' }}>📱 Setup Guide: Firebase + GitHub</h1>

            <div style={{ background: '#f5f5f7', padding: '1.5rem', borderRadius: '12px', lineHeight: '1.8', marginBottom: '1.5rem', fontSize: '0.9rem' }}>
              <h2 style={{ marginBottom: '0.8rem' }}>Step 1: Create Firebase Project</h2>
              <ol style={{ marginLeft: '1.5rem', marginBottom: '1.5rem' }}>
                <li>Go to <strong>firebase.google.com</strong></li>
                <li>Click "Go to console"</li>
                <li>Click "Create project"</li>
                <li>Name it "Body Tracker" (or your choice)</li>
                <li>Skip Google Analytics</li>
                <li>Create project</li>
              </ol>

              <h2 style={{ marginBottom: '0.8rem' }}>Step 2: Get Credentials</h2>
              <ol style={{ marginLeft: '1.5rem', marginBottom: '1.5rem' }}>
                <li>Click ⚙️ (Settings) → Project settings</li>
                <li>Scroll to "Your apps" → Click "Web"</li>
                <li>Copy all the config details (apiKey, authDomain, projectId, etc.)</li>
              </ol>

              <h2 style={{ marginBottom: '0.8rem' }}>Step 3: Enable Authentication</h2>
              <ol style={{ marginLeft: '1.5rem', marginBottom: '1.5rem' }}>
                <li>Left menu → Authentication</li>
                <li>Click "Get started"</li>
                <li>Enable "Anonymous"</li>
              </ol>

              <h2 style={{ marginBottom: '0.8rem' }}>Step 4: Enable Realtime Database</h2>
              <ol style={{ marginLeft: '1.5rem', marginBottom: '1.5rem' }}>
                <li>Left menu → Realtime Database</li>
                <li>Click "Create database"</li>
                <li>Start in "Test mode" (for development)</li>
                <li>Choose region closest to you</li>
              </ol>

              <h2 style={{ marginBottom: '0.8rem' }}>Step 5: Database Rules</h2>
              <p style={{ marginBottom: '0.8rem' }}>Click "Rules" and paste:</p>
              <pre style={{ background: '#fff', padding: '1rem', borderRadius: '6px', overflow: 'auto', fontSize: '0.8rem', marginBottom: '1rem' }}>
{`{
  "rules": {
    "users": {
      "$uid": {
        ".read": "$uid === auth.uid",
        ".write": "$uid === auth.uid"
      }
    },
    "shared": {
      ".read": "auth != null",
      ".write": "auth != null"
    }
  }
}`}
              </pre>
              <p>Click "Publish"</p>
            </div>

            <button
              onClick={() => setStep('credentials')}
              style={{
                width: '100%',
                padding: '0.75rem',
                background: '#0071e3',
                color: 'white',
                border: 'none',
                borderRadius: '8px',
                fontSize: '1rem',
                fontWeight: '600',
                cursor: 'pointer',
              }}
            >
              I've Set Up Firebase →
            </button>
          </div>
        );
      }

      if (step === 'credentials') {
        return (
          <div style={{ padding: '2rem', maxWidth: '600px', margin: '0 auto' }}>
            <h1 style={{ marginBottom: '1.5rem' }}>Enter Firebase Credentials</h1>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem', marginBottom: '1.5rem' }}>
              {Object.keys(credentials).map(key => (
                <div key={key}>
                  <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: '600', marginBottom: '0.3rem', color: '#1d1d1d' }}>
                    {key}
                  </label>
                  <input
                    type="text"
                    value={credentials[key]}
                    onChange={(e) => setCredentials({ ...credentials, [key]: e.target.value })}
                    placeholder={key}
                    style={{
                      width: '100%',
                      padding: '0.6rem',
                      border: '1px solid #e5e5ea',
                      borderRadius: '6px',
                      fontSize: '0.9rem',
                      fontFamily: 'monospace',
                    }}
                  />
                </div>
              ))}
            </div>

            <button
              onClick={handleSaveCredentials}
              disabled={testing}
              style={{
                width: '100%',
                padding: '0.75rem',
                background: '#0071e3',
                color: 'white',
                border: 'none',
                borderRadius: '8px',
                fontSize: '1rem',
                fontWeight: '600',
                cursor: testing ? 'not-allowed' : 'pointer',
                opacity: testing ? 0.6 : 1,
              }}
            >
              {testing ? 'Connecting...' : 'Connect Firebase'}
            </button>

            {testMessage && (
              <div style={{ marginTop: '1rem', padding: '0.75rem', background: testMessage.includes('✅') ? '#f0f9ff' : '#fef2f2', borderRadius: '6px', fontSize: '0.9rem', color: testMessage.includes('✅') ? '#0071e3' : '#ff3b30' }}>
                {testMessage}
              </div>
            )}
          </div>
        );
      }
    };

    // ============================================
    // MAIN APP COMPONENT
    // ============================================
    const App = () => {
      const [user, setUser] = useState(null);
      const [setupComplete, setSetupComplete] = useState(false);

      useEffect(() => {
        const firebase_projectId = localStorage.getItem('firebase_projectId');
        if (firebase_projectId) {
          const result = initializeFirebase();
          if (result) {
            auth.onAuthStateChanged((currentUser) => {
              if (currentUser) {
                setUser(currentUser);
                setSetupComplete(true);
              }
            });
          }
        }
      }, []);

      if (!setupComplete) {
        return <LoginScreen onSetupComplete={() => setSetupComplete(true)} />;
      }

      return <MainApp user={user} onLogout={() => { auth.signOut(); setSetupComplete(false); setUser(null); }} />;
    };

    // ============================================
    // MAIN APP (your existing app with Firebase)
    // ============================================
    const MainApp = ({ user, onLogout }) => {
      // [Your entire app code here - copy from nourish-mobile.jsx]
      // Replace all window.storage.set/get/delete with StorageAdapter

      return (
        <div style={{ minHeight: '100vh', background: '#f5f5f7', display: 'flex', flexDirection: 'column', fontFamily: 'system-ui, -apple-system, sans-serif' }}>
          <div style={{ flex: 1, padding: '1rem', textAlign: 'center', paddingBottom: '70px' }}>
            <h1 style={{ marginBottom: '1rem' }}>Body & Nutrition Tracker</h1>
            <p style={{ marginBottom: '2rem', color: '#86868b' }}>
              ✅ Connected to Firebase<br/>
              👤 User ID: {user?.uid?.slice(0, 8)}...
            </p>
            
            <div style={{ background: 'white', borderRadius: '12px', padding: '2rem', marginBottom: '1rem', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
              <p style={{ marginBottom: '1rem', color: '#1d1d1d' }}>
                🚀 Firebase is connected!<br/>
                Your data will now sync across all devices.
              </p>
              <p style={{ fontSize: '0.9rem', color: '#86868b', marginBottom: '1.5rem' }}>
                The full app code needs to be integrated with StorageAdapter.<br/>
                See the deployment guide below.
              </p>
            </div>

            <button
              onClick={onLogout}
              style={{
                padding: '0.75rem 1.5rem',
                background: '#ff3b30',
                color: 'white',
                border: 'none',
                borderRadius: '8px',
                cursor: 'pointer',
                fontWeight: '600',
              }}
            >
              Logout
            </button>
          </div>

          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', borderTop: '1px solid #e5e5ea', padding: '0.75rem', textAlign: 'center', fontSize: '0.8rem', color: '#86868b' }}>
            Data synced to Firebase ✨
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
