  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useRef, useEffect } from 'react';

    import {

    // =========================================================================
    // Firebase config (safe to be public — access is controlled by Firestore
    // security rules + Firebase Auth, not by hiding this object).
    // =========================================================================
    const FIREBASE_API_KEY = 'AIzaSyD8xCQ78af5vk7LaCGL5Ku1nzt3oC9jb3E';
    const FIREBASE_PROJECT_ID = 'body-tracker-5347e';

    // =========================================================================
    // Session persistence (email/password auth via Firebase's REST API)
    // =========================================================================
    const SESSION_KEY = 'bt_session';

    const loadSession = () => {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    };
    const persistSession = (s) => localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    const clearSession = () => localStorage.removeItem(SESSION_KEY);

    let session = loadSession(); // { uid, email, idToken, refreshToken, expiresAt }

    // =========================================================================
    // Firebase Auth REST helpers
    // =========================================================================
    const IDENTITY_BASE = 'https://identitytoolkit.googleapis.com/v1';
    const SECURE_TOKEN_BASE = 'https://securetoken.googleapis.com/v1';

    const AUTH_ERROR_MESSAGES = {
      EMAIL_EXISTS: 'An account with that email already exists — try signing in instead.',
      EMAIL_NOT_FOUND: 'No account found with that email — try creating one.',
      INVALID_PASSWORD: 'Incorrect password.',
      INVALID_LOGIN_CREDENTIALS: 'Incorrect email or password.',
      WEAK_PASSWORD: 'Password should be at least 6 characters.',
      INVALID_EMAIL: 'That doesn’t look like a valid email address.',
      TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts — please wait a bit and try again.',
      OPERATION_NOT_ALLOWED:
        'Email/password sign-in isn’t enabled yet — enable it in the Firebase console under Authentication → Sign-in method.',
    };

    const friendlyAuthError = (rawMessage) => {
      const code = (rawMessage || '').split(' : ')[0].trim();
      return AUTH_ERROR_MESSAGES[code] || rawMessage || 'Something went wrong. Please try again.';
    };

    const authRequest = async (path, body) => {
      const res = await fetch(`${IDENTITY_BASE}/${path}?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(friendlyAuthError(data.error?.message));
      return data;
    };

    const applySession = (data) => {
      session = {
        uid: data.localId || data.user_id,
        email: data.email || session?.email || '',
        idToken: data.idToken || data.id_token,
        refreshToken: data.refreshToken || data.refresh_token,
        expiresAt: Date.now() + Number(data.expiresIn || data.expires_in || 3600) * 1000,
      };
      persistSession(session);
      return session;
    };

    const signUpWithEmail = async (email, password) => {
      const data = await authRequest('accounts:signUp', { email, password, returnSecureToken: true });
      return applySession({ ...data, email });
    };

    const signInWithEmail = async (email, password) => {
      const data = await authRequest('accounts:signInWithPassword', { email, password, returnSecureToken: true });
      return applySession({ ...data, email });
    };

    const refreshSession = async () => {
      if (!session?.refreshToken) throw new Error('No session to refresh');
      const res = await fetch(`${SECURE_TOKEN_BASE}/token?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(session.refreshToken)}`,
      });
      const data = await res.json();
      if (!res.ok) throw new Error('Session expired — please sign in again.');
      return applySession(data);
    };

    const getValidIdToken = async () => {
      if (!session) throw new Error('Not signed in');
      if (Date.now() > session.expiresAt - 60000) {
        await refreshSession();
      }
      return session.idToken;
    };

    const signOutLocally = () => {
      session = null;
      clearSession();
    };

    // =========================================================================
    // Firestore REST helpers
    //
    // Every value the app stores is already a JSON string (the component code
    // calls JSON.stringify before saving and JSON.parse after loading), so each
    // Firestore document only ever needs a single string field, "v". That lets
    // us skip building a general JS <-> Firestore type converter entirely.
    // =========================================================================
    const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;

    const fsGet = async (uid, key) => {
      const token = await getValidIdToken();
      const res = await fetch(`${FIRESTORE_BASE}/users/${uid}/data/${encodeURIComponent(key)}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`Firestore read failed (${res.status})`);
      const doc = await res.json();
      return doc.fields?.v?.stringValue ?? null;
    };

    const fsSet = async (uid, key, value) => {
      const token = await getValidIdToken();
      const url = `${FIRESTORE_BASE}/users/${uid}/data/${encodeURIComponent(key)}?updateMask.fieldPaths=v`;
      const res = await fetch(url, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { v: { stringValue: value } } }),
      });
      if (!res.ok) throw new Error(`Firestore write failed (${res.status})`);
    };

    const fsListPrefix = async (uid, prefix) => {
      const token = await getValidIdToken();
      const keys = [];
      let pageToken;
      do {
        const params = new URLSearchParams({ pageSize: '300' });
        if (pageToken) params.set('pageToken', pageToken);
        const res = await fetch(`${FIRESTORE_BASE}/users/${uid}/data?${params}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error(`Firestore list failed (${res.status})`);
        const data = await res.json();
        (data.documents || []).forEach((doc) => {
          const docId = decodeURIComponent(doc.name.split('/').pop());
          if (docId.startsWith(prefix)) keys.push(docId);
        });
        pageToken = data.nextPageToken;
      } while (pageToken);
      return keys;
    };

    // Installs the window.storage.get/set/list(key, shared) interface that the
    // ported CalorieTracker component already calls, backed by Firestore and
    // scoped to the signed-in user's uid.
    const installStorageFor = (uid) => {
      window.storage = {
        get: async (key) => ({ value: await fsGet(uid, key) }),
        set: async (key, value) => {
          await fsSet(uid, key, value);
        },
        list: async (prefix) => ({ keys: await fsListPrefix(uid, prefix) }),
      };
    };

    // =========================================================================
    // Anthropic API key (bring-your-own-key, stored only in this browser)
    // =========================================================================
    const anthropicHeaders = () => {
      const key = localStorage.getItem('anthropic_api_key');
      if (!key) {
        window.dispatchEvent(new CustomEvent('anthropic-key-missing'));
        throw new Error('MISSING_API_KEY');
      }
      return {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      };
    };

    // =========================================================================
    // Login screen
    // =========================================================================
    const LoginScreen = ({ onAuthed }) => {
      const [mode, setMode] = useState('signin'); // 'signin' | 'signup'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const submit = async () => {
        if (!email.trim() || !password) {
          setError('Enter an email and password.');
          return;
        }
        setBusy(true);
        setError('');
        try {
          const data = mode === 'signup'
            ? await signUpWithEmail(email.trim(), password)
            : await signInWithEmail(email.trim(), password);
          installStorageFor(data.uid);
          onAuthed({ uid: data.uid, email: data.email });
        } catch (e) {
          setError(e.message);
        }
        setBusy(false);
      };

      return (
        <div style={{ minHeight: '100vh', background: '#f5f5f7', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }}>
          <div style={{ background: '#fff', borderRadius: '16px', padding: '2rem', maxWidth: '360px', width: '100%', boxShadow: '0 2px 10px rgba(0,0,0,0.08)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.3rem' }}>
              <div style={{ width: '32px', height: '32px', borderRadius: '8px', background: '#0071e3', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <Leaf size={17} color="white" />
              </div>
              <h1 style={{ fontSize: '1.2rem', fontWeight: '700', color: '#1d1d1d', margin: 0 }}>Body & Nutrition Tracker</h1>
            </div>
            <p style={{ color: '#86868b', margin: '0.6rem 0 1.5rem', fontSize: '0.85rem' }}>
              {mode === 'signup' ? 'Create your account' : 'Sign in to your data'}
            </p>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem', marginBottom: '1.2rem' }}>
              <div>
                <label style={{ display: 'block', fontSize: '0.7rem', fontWeight: '600', marginBottom: '0.3rem', color: '#1d1d1d' }}>Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && submit()}
                  placeholder="you@example.com"
                  style={{ width: '100%', padding: '0.65rem 0.7rem', border: '1px solid #e5e5ea', borderRadius: '6px', fontSize: '0.85rem', boxSizing: 'border-box' }}
                />
              </div>
              <div>
                <label style={{ display: 'block', fontSize: '0.7rem', fontWeight: '600', marginBottom: '0.3rem', color: '#1d1d1d' }}>Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && submit()}
                  placeholder={mode === 'signup' ? 'At least 6 characters' : '••••••••'}
                  style={{ width: '100%', padding: '0.65rem 0.7rem', border: '1px solid #e5e5ea', borderRadius: '6px', fontSize: '0.85rem', boxSizing: 'border-box' }}
                />
              </div>
            </div>

            {error && (
              <div style={{ marginBottom: '1rem', padding: '0.6rem 0.7rem', background: '#fef2f2', borderRadius: '6px', fontSize: '0.8rem', color: '#ff3b30', lineHeight: 1.4 }}>
                {error}
              </div>
            )}

            <button
              onClick={submit}
              disabled={busy}
              style={{ width: '100%', padding: '0.75rem', background: '#0071e3', color: 'white', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer', opacity: busy ? 0.6 : 1, fontSize: '0.9rem' }}
            >
              {busy ? 'Please wait…' : mode === 'signup' ? 'Create account' : 'Sign in'}
            </button>

            <button
              onClick={() => { setMode(mode === 'signup' ? 'signin' : 'signup'); setError(''); }}
              style={{ width: '100%', marginTop: '0.8rem', padding: '0.5rem', background: 'none', border: 'none', color: '#0071e3', cursor: 'pointer', fontSize: '0.8rem' }}
            >
              {mode === 'signup' ? 'Already have an account? Sign in' : 'No account yet? Create one'}
            </button>
          </div>
        </div>
      );
    };

const DEFAULT_GOALS = {

const todayKey = () => new Date().toISOString().split('T')[0];

const formatDateLabel = (dateStr) => {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date();
  const isToday = date.toDateString() === today.toDateString();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  const isYesterday = date.toDateString() === yesterday.toDateString();

  const label = date.toLocaleDateString('en-US', {
    weekday: 'long',
    month: 'long',
    day: 'numeric',
  });

  if (isToday) return `Today · ${label}`;
  if (isYesterday) return `Yesterday · ${label}`;
  return label;
};

const shortDateLabel = (dateStr) => {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};

const WEEKDAY_HEADERS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

const parseTimeToHour = (timestampStr) => {
  const match = (timestampStr || '').match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!match) return null;
  let hour = parseInt(match[1], 10);
  const period = match[3].toUpperCase();
  if (period === 'PM' && hour !== 12) hour += 12;
  if (period === 'AM' && hour === 12) hour = 0;
  return hour;
};

const getDayPeriodKey = (hour) => {
  if (hour === null) return null;
  if (hour >= 5 && hour < 12) return 'Morning';
  if (hour >= 12 && hour < 17) return 'Afternoon';
  if (hour >= 17 && hour < 21) return 'Evening';
  return 'Night';
};

const dateOffset = (days) => {
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString().split('T')[0];
};

const buildMonthGrid = (year, month) => {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
  }
  while (cells.length % 7 !== 0) cells.push(null);

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
};

const renderBold = (text) => {
  if (!text) return null;
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**')) {
      return (
        <strong key={i} style={{ color: COLORS.textPrimary, fontWeight: '700' }}>
          {part.slice(2, -2)}
        </strong>
      );
    }
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
};

const parseDaySummary = (text) => {
  if (!text) return null;
  const good = text.match(/GOOD:\s*(.*)/i)?.[1]?.trim();
  const watch = text.match(/WATCH:\s*(.*)/i)?.[1]?.trim();
  const next = text.match(/NEXT:\s*(.*)/i)?.[1]?.trim();
  if (!good && !watch && !next) return null;
  return { good, watch, next };
};

const parseBodyAnalysis = (text) => {
  if (!text) return null;
  const status = text.match(/STATUS:\s*(.*)/i)?.[1]?.trim();
  const analysis = text.match(/ANALYSIS:\s*(.*)/i)?.[1]?.trim();
  const advice = text.match(/ADVICE:\s*(.*)/i)?.[1]?.trim();
  if (!status && !analysis && !advice) return null;
  return { status, analysis, advice };
};

const parseNextMeal = (text) => {
  if (!text) return null;
  const meal = text.match(/MEAL:\s*(.*)/i)?.[1]?.trim();
  const macros = text.match(/MACROS:\s*(.*)/i)?.[1]?.trim();
  const prep = text.match(/PREP:\s*(.*)/i)?.[1]?.trim();
  const why = text.match(/WHY:\s*(.*)/i)?.[1]?.trim();
  if (!meal && !macros && !prep && !why) return null;
  return { meal, macros, prep, why };
};

const getWeightDeltaDisplay = (delta, goal) => {
  if (delta === null || delta === undefined) return null;
  if (delta === 0) return { Icon: Minus, color: COLORS.textSecondary, label: 'No change' };
  const isDecrease = delta < 0;
  let color;
  if (goal === 'lose') color = isDecrease ? '#6b9d8a' : '#d97757';
  else if (goal === 'gain') color = isDecrease ? '#d97757' : '#6b9d8a';
  else color = '#8b7355';
  return {
    Icon: isDecrease ? TrendingDown : TrendingUp,
    color,
    label: `${isDecrease ? '' : '+'}${delta} kg`,
  };
};

const resizeImageFile = (file, maxDim = 500, quality = 0.75) =>
  new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new window.Image();
      img.onerror = () => reject(new Error('Could not load image'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

const dataUrlToBase64 = (dataUrl) => dataUrl.split(',')[1] || '';

const getCalorieBand = (calories, goalCalories) => {
  const over = calories - goalCalories;
  if (over <= 0) return 'green';
  if (over <= 300) return 'yellow';
  return 'red';
};

const calculateBMR = ({ weight, height, age, sex }) => {
  const base = 10 * weight + 6.25 * height - 5 * age;
  return sex === 'male' ? base + 5 : base - 161;
};

const calculateTargets = ({ weight, height, age, sex, activityLevel, goal, goalRate }) => {
  const bmr = calculateBMR({ weight, height, age, sex });
  const activity = ACTIVITY_LEVELS.find((a) => a.id === activityLevel) || ACTIVITY_LEVELS[2];
  const tdee = bmr * activity.multiplier;

  let targetCalories = tdee;
  if (goal === 'lose' || goal === 'gain') {
    const rate = GOAL_RATES.find((r) => r.id === goalRate) || GOAL_RATES[1];
    targetCalories = goal === 'lose' ? tdee - rate.calAdjust : tdee + rate.calAdjust;
  }
  targetCalories = Math.max(1200, Math.round(targetCalories));

  const targetProtein = Math.round(weight * 1.8);
  const targetFat = Math.round((targetCalories * 0.27) / 9);
  const remainingCals = Math.max(0, targetCalories - targetProtein * 4 - targetFat * 9);
  const targetCarbs = Math.round(remainingCals / 4);

  return {
    bmr: Math.round(bmr),
    tdee: Math.round(tdee),
    targetCalories,
    targetProtein,
    targetCarbs,
    targetFat,
  };
};

const getProgressColor = (percentage) => {
  if (percentage <= 100) return '#6b9d8a';
  if (percentage <= 110) return '#f4a957';
  return '#d97757';
};

const CompactNutrientBar = ({ label, consumed, goal, unit, last }) => {
  const percentage = Math.min(100, (consumed / goal) * 100);
  const displayPct = Math.round((consumed / goal) * 100);

              width: '100%',
              maxWidth: '360px',
              boxShadow: '0 10px 30px rgba(0,0,0,0.2)',
            }}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
              <h3 style={{ fontSize: '1rem', fontWeight: '700', color: COLORS.textPrimary, margin: 0 }}>Settings</h3>
              <button
                onClick={() => setApiKeyModalOpen(false)}
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: COLORS.textTertiary, padding: '0.25rem' }}
              >
                <X size={16} />
              </button>
            </div>

            {userEmail && (
              <div style={{ fontSize: '0.75rem', color: COLORS.textSecondary, marginBottom: '1rem' }}>
                Signed in as <strong style={{ color: COLORS.textPrimary }}>{userEmail}</strong>
              </div>
            )}

            <label style={{ fontSize: '0.75rem', fontWeight: '600', color: COLORS.textSecondary, display: 'block', marginBottom: '0.3rem' }}>
              Anthropic API key
            </label>
            <input
              type="password"
              value={apiKeyInput}
              onChange={(e) => setApiKeyInput(e.target.value)}
              placeholder="sk-ant-..."
              style={{
                width: '100%',
                padding: '0.55rem 0.6rem',
                border: `1px solid ${COLORS.borderLight}`,
                borderRadius: '6px',
                fontSize: '0.8rem',
                fontFamily: 'monospace',
                boxSizing: 'border-box',
                marginBottom: '0.4rem',
              }}
            />
            <p style={{ fontSize: '0.65rem', color: COLORS.textTertiary, lineHeight: 1.4, marginBottom: '0.9rem' }}>
              Stored only in this browser's local storage and sent directly from your browser to Anthropic's API — never to any other server.
              Get a key at{' '}
              <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer" style={{ color: COLORS.accentBlue }}>
                console.anthropic.com
              </a>.
            </p>

            <button
              onClick={saveApiKey}
              style={{
                width: '100%',
                padding: '0.6rem',
                background: COLORS.accentBlue,
                color: 'white',
                border: 'none',
                borderRadius: '6px',
                fontSize: '0.85rem',
                fontWeight: '600',
                cursor: 'pointer',
                marginBottom: '0.6rem',
              }}
            >
              Save
            </button>

            {onSignOut && (
              <button
                onClick={onSignOut}
                style={{
                  width: '100%',
                  padding: '0.55rem',
                  background: 'transparent',
                  color: COLORS.accentRed,
                  border: `1px solid ${COLORS.borderLight}`,
                  borderRadius: '6px',
                  fontSize: '0.8rem',
                  fontWeight: '500',
                  cursor: 'pointer',
                }}
              >
                Sign out
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

    // =========================================================================
    // Root: gates the app behind sign-in, restores a session on reload
    // =========================================================================
    const Root = () => {
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(true);

      useEffect(() => {
        const restore = async () => {
          if (session) {
            try {
              await getValidIdToken();
              installStorageFor(session.uid);
              setUser({ uid: session.uid, email: session.email });
            } catch (e) {
              signOutLocally();
            }
          }
          setChecking(false);
        };
        restore();
      }, []);

      if (checking) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', color: '#86868b' }}>
            Loading…
          </div>
        );
      }

      if (!user) {
        return <LoginScreen onAuthed={setUser} />;
      }

      return (
        <CalorieTracker
          userEmail={user.email}
          onSignOut={() => {
            signOutLocally();
            window.storage = undefined;
            setUser(null);
          }}
        />
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
